name: Scrape PCPNDT

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install packages
        run: |
          Rscript -e 'install.packages(c("rvest","dplyr","googlesheets4"))'

      - name: Create credentials file
        run: |
          echo '${{ secrets.GSHEET_CREDENTIALS }}' > credentials.json

      - name: Run scraper
        run: |
          Rscript scrape.R
